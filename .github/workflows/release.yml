
name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./typescript-tetris-game-1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package build artifacts
        run: |
          zip -r tetris-web-application-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: USTP CI/CD Tetris ${{ github.ref_name }}
          generate_release_notes: true
          files: typescript-tetris-game-1.0.0/tetris-web-application-${{ github.ref_name }}.zip
