
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./typescript-tetris-game-1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript-tetris-game-1.0.0/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        continue-on-error: true
